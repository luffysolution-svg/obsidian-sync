name: release

# 三渠道自动发版：npx（GitHub main 分支）+ npm（npm publish）+ Release 包（zip）
# 触发方式：推送 vX.Y.Z tag（推荐）；或手动 workflow_dispatch 兜底（tag 推送未触发时用）
# 前置：仓库需配置 NPM_TOKEN secret（npm 账号 publish 权限的 token）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（须与 package.json 一致），如 1.4.1"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify version
        run: |
          ver="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            want="v${ver}"
            echo "push: tag=${tag} | package.json=${ver}"
          else
            want="v${{ inputs.version }}"
            echo "dispatch: version=${{ inputs.version }} | package.json=${ver}"
          fi
          if [ "${want}" != "v${ver}" ]; then
            echo "::error::版本不一致（期望 ${want}，package.json 为 ${ver}）。请先 bump 版本：npm version patch/minor/major"
            exit 1
          fi

      - name: Build release zip
        run: |
          ver="$(node -p "require('./package.json').version")"
          mkdir -p dist
          (cd skills && zip -r "../dist/obsidian-sync-v${ver}.zip" obsidian-sync)
          ls -la dist
          echo "zip: dist/obsidian-sync-v${ver}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          files: dist/obsidian-sync-v*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN 未配置，跳过 npm publish"
            exit 0
          fi
          npm publish
